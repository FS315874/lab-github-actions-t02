name: Pipeline DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v6

      - name: Construir imagen Docker
        run: docker build -t lab-github-actions:latest .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simular tests
        run: |
          echo "Ejecutando pruebas..."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simular deploy
        run: echo "Simulacion de despliegue completada"